# Approved models only. Capability Router resolves within this registry.
# Arbitrary Comfy checkpoints are never exposed as selectable options.

models:
  anima_base:
    provider: comfyui
    checkpoint: anima_baseV10.safetensors
    capabilities:
      - BaseRender
    workflow_template: workflows/comfy/anima_base.template.yaml

  anima_pose:
    provider: comfyui
    checkpoint: anima_baseV10.safetensors
    control_model: anima-lllite-pose-1.safetensors
    capabilities:
      - PoseControlledRender
    workflow_template: workflows/comfy/anima_pose.template.yaml

  # Stock MOSS-Image-SFT — LayoutGuidedRender (does NOT replace Anima BaseRender).
  # Native Comfy loaders only; layout JSON optional (natural language alone is valid).
  moss_image_sft:
    provider: comfyui
    checkpoint: moss_image_sft_int8_convrot.safetensors
    text_encoder: qwen3.5_9b_w4a8_gptq.safetensors
    vae: flux2-vae_small.safetensors
    capabilities:
      - LayoutGuidedRender
    workflow_template: workflows/comfy/moss_sft.template.yaml
    notes: "ComfyUI native MOSS (min e087d8f+; recommended >= 0.42.1). Weights from Comfy-Org/MOSS-Image."

  qwen_image_edit_2509:
    provider: comfyui
    checkpoint: qwen_image_edit_2509_fp8_e4m3fn.safetensors
    capabilities:
      - ImageEdit
      - OutfitTryOn
      - ExpressionEdit
    workflow_template: workflows/comfy/qwen_tryon.template.yaml

  google_flash_image:
    provider: google
    model: gemini-2.5-flash-image
    capabilities:
      - ReferenceAssetGeneration

approved_models:
  BaseRender: anima_base
  PoseControlledRender: anima_pose
  LayoutGuidedRender: moss_image_sft
  OutfitTryOn: qwen_image_edit_2509
  ExpressionEdit: qwen_image_edit_2509
  ImageEdit: qwen_image_edit_2509
  ReferenceAssetGeneration: google_flash_image
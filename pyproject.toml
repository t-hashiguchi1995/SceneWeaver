[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sceneweaver"
version = "0.1.0"
description = "SceneWeaver — character content production workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
vision = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "Pillow>=10.0.0",
]

[project.scripts]
sceneweaver = "creator_studio.cli:main"
sceneweaver-api = "creator_studio.cli:run_api"
sceneweaver-worker = "creator_studio.cli:run_worker"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = true